<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="choice.css">
    <link rel="stylesheet" href="levels.css">
</head>

<body>
    <div class="topbar">
    <h2>CodeMonkX</h2>
   <div class="profile" id="profileBtn">
    <img src="images/profle.png" alt="Profile">

    <div class="dropdown" id="dropdownMenu">
        <div class="dropdown-header">
            <img src="images/profle.png">
            <div>
                <p class="name"></p>
            </div>
        </div>

        <div class="dropdown-item" onclick="goToProfile()"> My Profile</div>
        <div class="dropdown-item logout" onclick="logout()">Logout</div>
    </div>
</div>
</div>

<div class="container">
    <h1>Select Your Language</h1>

    <div class="choices">

<a href="levels.html" class="card" data-lang="C">
    <img src="images/OIP.png">
    <span>C</span>
</a>

<a href="levels.html" class="card" data-lang="Cpp">
    <img src="images/c++.png">
    <span>C++</span>
</a>

<a href="levels.html" class="card" data-lang="Python">
    <img src="images/python.png">
    <span>Python</span>
</a>

<a href="levels.html" class="card" data-lang="Java">
    <img src="images/java.png">
    <span>Java</span>
</a>

    </div>
</div>
<script>
    // 🔐 Auth guard
    if (!localStorage.getItem("username")) {
        window.location.href = "login.html";
    }

    // 🎯 Save selected language
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
            const lang = card.dataset.lang;
            localStorage.setItem('currentLang', lang);
        });
    });

    // 👤 Show username
    const username = localStorage.getItem('username') || 'Guest';
    document.querySelector('.name').textContent = username;

    // 🔽 Profile dropdown
    const profileBtn = document.getElementById('profileBtn');
    const dropdown = document.getElementById('dropdownMenu');

    profileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('show');
    });

    window.addEventListener('click', (e) => {
        if (!profileBtn.contains(e.target)) {
            dropdown.classList.remove('show');
        }
    });

    function goToProfile() {
        window.location.href = 'profile.html';
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
