<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMonkX — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ecf5ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            color: #56a5eb;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
        }

        .card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(86, 165, 235, 0.15);
            width: 100%;
            max-width: 380px;
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid #eef3fb;
        }

        .tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #56a5eb;
            border-bottom-color: #56a5eb;
        }

        /* Form panels */
        .panel { display: none; padding: 30px; }
        .panel.active { display: block; }

        .panel h3 {
            font-size: 1.1rem;
            color: #1b2a41;
            margin-bottom: 6px;
        }

        .panel p {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0ecfb;
            border-radius: 9px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            color: #1b2a41;
            outline: none;
            transition: border 0.2s;
            background: #fafcff;
        }

        .input-group input:focus {
            border-color: #56a5eb;
            background: white;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #56a5eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-submit:hover {
            background: #3891df;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #a8d0f5;
            cursor: not-allowed;
            transform: none;
        }

        /* Message */
        .msg {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            display: none;
        }
        .msg.error   { background: #fff0f0; color: #e74c3c; display: block; }
        .msg.success { background: #f0fff5; color: #27ae60; display: block; }
    </style>
</head>
<body>

    <div class="brand">CodeMonkX</div>

    <div class="card">
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- Login Panel -->
        <div class="panel active" id="loginPanel">

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" />
            </div>

            <button class="btn-submit" id="loginBtn" onclick="handleLogin()">Login</button>
            <div class="msg" id="loginMsg"></div>
        </div>

        <!-- Register Panel -->
        <div class="panel" id="registerPanel">

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username" />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Choose a password" />
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="Repeat password" />
            </div>

            <button class="btn-submit" id="registerBtn" onclick="handleRegister()">Create Account</button>
            <div class="msg" id="registerMsg"></div>
        </div>
    </div>

<script>
    if (localStorage.getItem("username")) {
        window.location.href = "choice.html";
    }
    // Tab switching
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginPanel').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('registerPanel').classList.add('active');
        }
    }

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `msg ${type}`;
    }

    // Login
    async function handleLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');

        if (!username || !password) return showMsg('loginMsg', 'Please fill in all fields.', 'error');

        btn.disabled = true;
        btn.textContent = 'Logging in...';
        
        try {
            const res = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            let data;
            try {
                data = await res.json();
            } catch {
                return showMsg('loginMsg', 'Invalid server response.', 'error');
            }

            if (!res.ok) {
                showMsg('loginMsg', data.error, 'error');
            } else {
                if (!data.username || !data.userId) {
                    return showMsg('loginMsg', 'Invalid server response.', 'error');
                }
                localStorage.clear();
                // Save username so levels page can show it
                localStorage.setItem('username', data.username);
                localStorage.setItem('userId', data.userId);
                
                showMsg('loginMsg', 'Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'choice.html', 800);
            }
        } catch {
            showMsg('loginMsg', 'Could not connect to server.', 'error');
        }

        btn.disabled = false;
        btn.textContent = 'Login';
    }

    // Register
    async function handleRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm  = document.getElementById('regConfirm').value;
        const btn = document.getElementById('registerBtn');

        if (!username || !password || !confirm) return showMsg('registerMsg', 'Please fill in all fields.', 'error');
        if (password !== confirm) return showMsg('registerMsg', 'Passwords do not match.', 'error');
        if (password.length < 6) return showMsg('registerMsg', 'Password must be at least 6 characters.', 'error');

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
            const res = await fetch('http://localhost:3000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (!res.ok) {
                showMsg('registerMsg', data.error, 'error');
            } else {
                showMsg('registerMsg', 'Account created! Switching to login...', 'success');
                setTimeout(() => switchTab('login'), 1200);
            }
        } catch {
            showMsg('registerMsg', 'Could not connect to server.', 'error');
        }

        btn.disabled = false;
        btn.textContent = 'Create Account';
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        if (document.getElementById('loginBtn').disabled) return;
        if (document.getElementById('loginPanel').classList.contains('active')) handleLogin();
        else handleRegister();
    });
</script>

</body>
</html>
